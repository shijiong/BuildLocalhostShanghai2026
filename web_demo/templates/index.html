<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot SDK 智能体 Demo</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Copilot SDK 智能体 Demo</h1>
      <p class="sub">输入问题并可选上传一张图片，选择模型后点击发送，后端会调用 Copilot SDK 进行分析并流式返回结果。</p>

      <form id="chat-form" class="card">
        <label for="model_choice">模型来源</label>
        <select id="model_choice" name="model_choice">
          <option value="gpt-5.4">gpt-5.4</option>
          <option value="ollama">ollama</option>
        </select>

        <label for="question">问题</label>
        <textarea id="question" name="question" rows="4" placeholder="例如：请分析这张图片并给出可执行建议" required></textarea>

        <label for="image">图像（可选）</label>
        <input id="image" name="image" type="file" accept="image/*" />

        <button id="send-btn" type="submit">发送</button>
      </form>

      <section class="card">
        <h2>回答</h2>
        <pre id="answer" class="answer">等待输入...</pre>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
